<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>게시판 UI</title>
    <style>
        *{margin: 5px;}
        input, textarea{ width: 95%;}
        input[type=submit] {width: 100px;}
        #boardTable{border: 1px solid grey; border-collapse: collapse; width: 500px;}
        #boardTable tr{text-align: center;}
        #boardTable th, td{border:  1px solid grey;}
        #boardTable td{text-align:  left;}
        #boardTable td.cen{text-align: center;}
        #boardTable td.subject{text-align: left;}
    </style>
</head>
<body>
    <header>
        <h2>게시판-목록</h2>
    </header>

    <nav> <a href="/">글 쓰기</a> </nav>

    <article>
        <table id="boardTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>날짜</th>
                </tr>
            </thead>
            
            <tbody>
                <tr>
                    <td class="cen">1</td>
                    <td>오늘은 리액트</td>
                    <td class="cen">낙찌썜</td>
                    <td class="cen">20-25-651</td>
                </tr>
            </tbody>
        </table>
    </article>

    <header>
        <h2>게시판-열람</h2>
    </header>

    <nav> 
        <a href="/">목록</a> 
        <a href="/">수정</a>
        <a href="/">삭제</a>
    </nav>

    <article>
        <table id="boardTable">
            <colgroup>
                <col width="30%" /><col width="*" />
            </colgroup>

            <tbody>
                <tr>
                    <th>작성자</th>
                    <td>성유겸</td>
                </tr>
                <tr>
                    <th>제목</th>
                    <td>오늘은 React 공부하는 날읽ㄹ</td>
                </tr>
                <tr>
                    <th>날짜</th>
                    <td>2026-09-21</td>
                </tr>
                <tr>
                    <th>내용</th>
                    <td>열심히 해볼까 <br /> 열공 </td>
                </tr>
            </tbody>
        </table>
    </article>

    <header>
        <h2>게시판-작성</h2>
    </header>

    <nav><a href="/">목록</a></nav>

    <article>
        <form>
            <table id="boardTable">
                <tbody>
                    <tr>
                        <th>작성자</th>
                        <td><input type="text" name="writer" /></td>
                    </tr>
                    <tr>
                        <th>제목</th>
                        <td><input type="text" name="title" /></td>
                    </tr>
                    <tr>
                        <th>내용</th>
                        <td><textarea name="contents" cols="22" rows="3"></textarea></td>
                    </tr>
                </tbody>
            </table>

            <button type="sbumit">전송</button>

        </form>
    </article>
    
</body>
</html>
